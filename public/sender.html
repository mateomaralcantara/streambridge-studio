<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050812" />
  <title>StreamBridge · Cámara móvil</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="shell">
    <div class="brand"><div class="logo">SB</div><div><b>Cámara móvil</b><div class="note" id="roomLabel" style="margin:2px 0 0"></div></div></div>
    <section class="grid">
      <article class="card full">
        <div class="video-wrap">
          <video id="preview" autoplay muted playsinline></video>
          <div class="hud"><span id="cameraBadge">Cámara detenida</span><span id="liveBadge">OFF AIR</span></div>
        </div>
        <div class="stats"><div class="stat"><b id="bitrate">0</b><span>Mbps</span></div><div class="stat"><b id="fps">0</b><span>FPS enviados</span></div><div class="stat"><b id="resolution">—</b><span>Resolución</span></div></div>
      </article>

      <article class="card">
        <h2>Controles</h2>
        <div class="field"><label>Calidad</label><select id="quality"><option value="720">720p · eficiente</option><option value="1080" selected>1080p · recomendado</option><option value="2160">4K · experimental</option></select></div>
        <div class="field"><label>Audio</label><select id="audioMode"><option value="on" selected>Cámara + micrófono</option><option value="off">Solo video</option></select></div>
        <div class="actions"><button id="start">Iniciar cámara</button><button id="switch" class="secondary" disabled>Cambiar cámara</button><button id="stop" class="danger" disabled>Detener</button></div>
      </article>

      <article class="card">
        <h2>Estado</h2>
        <span class="status" id="status"><span class="dot"></span><span data-label>Esperando inicio</span></span>
        <p class="note" id="detail">Mantén esta página abierta mientras transmites. En iPhone conviene desactivar temporalmente el bloqueo automático durante la sesión.</p>
      </article>
    </section>
  </main>
  <script type="module" src="/js/sender.js?v=20260927-obsfix1"></script>
</body>
</html>
